# Prometheus SANS Docker — backend Spring Boot sur la machine locale
#
# Si le target reste DOWN avec 127.0.0.1, remplacez par le nom de votre PC
# (ex. desktop-cuman6h) tel qu'affiché dans l'URL Actuator.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: pfe-backend
    metrics_path: /actuator/prometheus
    scrape_timeout: 10s
    static_configs:
      - targets:
          - "127.0.0.1:8080"
          - "localhost:8080"
          - "desktop-cuman6h:8080"
        labels:
          service: pfe-backend
