
spring.config.import=file:.env[.properties]
spring.datasource.url=${POSTGRES_HOST}
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.kafka.bootstrap-servers=${BOOTSTRAP_SERVERS}
spring.kafka.security.protocol=SSL
spring.kafka.ssl.key-password=${SSL_KEY_PASSWORD}
spring.kafka.properties.security.protocol=SSL
spring.kafka.properties.ssl.protocol=TLSv1.2
spring.kafka.ssl.trust-store-location=${SSL_TRUSTSTORE_LOCATION}
spring.kafka.ssl.key-store-location=${SSL_KEYSTORE_LOCATION}
spring.kafka.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
spring.kafka.ssl.trust-store-password=${SSL_TRUSTORE_PASSWORD}
spring.bootstrap.server=${BOOTSTRAP_SERVERS}