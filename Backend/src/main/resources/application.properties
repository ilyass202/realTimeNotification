
spring.config.import=file:.env[.properties]
spring.datasource.url=${POSTGRES_HOST}
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.kafka.bootstrap-servers=${BOOTSTRAP_SERVERS}
spring.kafka.security.protocol=SSL
spring.kafka.ssl.key-password=${SSL_KEY_PASSWORD}
spring.kafka.properties.security.protocol=SSL
spring.kafka.properties.ssl.protocol=TLSv1.2
spring.kafka.ssl.trust-store-location=${SSL_TRUSTSTORE_LOCATION}
spring.kafka.ssl.key-store-location=${SSL_KEYSTORE_LOCATION}
spring.kafka.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
spring.kafka.ssl.trust-store-password=${SSL_TRUSTORE_PASSWORD}
spring.bootstrap.server=${BOOTSTRAP_SERVERS}
pfe.kafka.ingress.concurrency=6
pfe.kafka.intermediate.concurrency=6
pfe.kafka.enrichment.concurrency=8
pfe.kafka.consumer.max-poll-records-fast=500
pfe.kafka.consumer.max-poll-records-enrich=25
spring.kafka.producer.batch-size=32768
spring.kafka.producer.linger-ms=5
spring.kafka.producer.compression-type=lz4
spring.kafka.producer.buffer-memory=67108864
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when_authorized
management.prometheus.metrics.export.enabled=true
management.metrics.distribution.percentiles-histogram.pfe.kafka.event_lag=true
management.metrics.distribution.percentiles-histogram.pfe.kafka.processing=true
management.metrics.tags.application=pfe-backend